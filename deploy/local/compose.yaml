name: opengym-local

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
      - ./coach-auth:/coach-auth
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
